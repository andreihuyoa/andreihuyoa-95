<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/assets/a.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (() => {
        const requestedMode = new URLSearchParams(window.location.search).get(
          "mode",
        );
        const savedMode = window.localStorage.getItem("design-mode");
        const mode =
          requestedMode === "website" || requestedMode === "os"
            ? requestedMode
            : savedMode === "website" || savedMode === "os"
              ? savedMode
              : "website";
        const savedTheme = window.localStorage.getItem("website-theme");
        const theme =
          savedTheme === "light" || savedTheme === "dark"
            ? savedTheme
            : window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";

        document.documentElement.dataset.mode = mode;
        document.documentElement.dataset.theme = theme;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
